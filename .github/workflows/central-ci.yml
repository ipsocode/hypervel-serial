name: central-ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conventions:
    name: Central conventions
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ipsocode/hypervel-packages-ci/conventions@e9d01f747223aa2ceb47590b22cbf8418a4e9834

  php84:
    name: Central PHP 8.4
    needs: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/ipsocode/hypervel/ci-alpine:8.4-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ipsocode/hypervel-packages-ci/install@e9d01f747223aa2ceb47590b22cbf8418a4e9834
        with:
          php: '8.4'
      - uses: ipsocode/hypervel-packages-ci/suite@e9d01f747223aa2ceb47590b22cbf8418a4e9834
        with:
          php: '8.4'
          style: 'true'
          min-coverage: '100'

  php85:
    name: Central PHP 8.5
    needs: php84
    runs-on: ubuntu-latest
    timeout-minutes: 7
    container:
      image: ghcr.io/ipsocode/hypervel/ci-alpine:8.5-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ipsocode/hypervel-packages-ci/install@e9d01f747223aa2ceb47590b22cbf8418a4e9834
        with:
          php: '8.5'
      - uses: ipsocode/hypervel-packages-ci/suite@e9d01f747223aa2ceb47590b22cbf8418a4e9834
        with:
          php: '8.5'

  plan:
    name: Central publish plan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - id: plan
        uses: ipsocode/hypervel-packages-ci/publish/plan@e9d01f747223aa2ceb47590b22cbf8418a4e9834
        with:
          event: workflow_dispatch
          ref: refs/heads/main
          bump: auto
          dry-run: 'true'
      - name: Show the plan
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          TAG: ${{ steps.plan.outputs.tag }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
          BREAKING: ${{ steps.plan.outputs.breaking }}
          FEATURES: ${{ steps.plan.outputs.features }}
        run: echo "mode=${MODE} tag=${TAG} previous=${PREVIOUS} breaking=[${BREAKING}] features=[${FEATURES}]"
